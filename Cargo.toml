[package]
name = "eureka-optimizer"
edition = "2021"
version = "0.1.0"
authors = ["Felipe Alves das Mercês <felipemercessesi@gmail.com>"]
description = "A short description"
license = "MIT"
repository = "https://github.com/fmrcs64/eureka-optimizer"
readme = "README.md"

[package.metadata]
cargo = { root = "src/rust" }

[dependencies]
llvm-sys = "181.1.0"
inkwell = { version = "0.8.0", default-features = false, features = ["llvm18-1"] }
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }  
anyhow = "1.0.100"
[[bin]]
name = "main"
path = "src/rust/main.rs"

[profile.release]
opt-level = 3
lto = true
debug = true